[project]
name = "bub-overalls"
dynamic = ["version"]
description = "Seatbelt and experimental Linux Landlock sandbox environments for Bub."
readme = "README.md"
license = "Apache-2.0"
# Bub's Environment API requires Python 3.12 or newer.
requires-python = ">=3.12"
dependencies = [
    "bub>=0.5.1",
]

[project.entry-points.bub]
overalls = "bub_overalls.plugin"

[project.scripts]
bub-overalls = "bub_overalls.main:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"
write_to = "bub_overalls/__version__.py"
write_template = "__version__ = \"{}\"\n"

[tool.pdm.build]
package-dir = "src"
includes = ["src/bub_overalls"]
source-includes = ["README.md", "LICENSE", "tests", "docs", "Makefile"]

[dependency-groups]
dev = ["mypy>=1.20", "pytest>=9", "pytest-asyncio>=1", "ruff>=0.15"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "G", "I", "SIM", "TID", "PL", "RUF", "N", "UP"]
ignore = ["E501", "PLR2004", "RUF012", "B009"]

[tool.ruff.lint.pylint]
max-args = 12
max-branches = 15

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["bub", "bub.*"]
# Bub has annotations but does not yet ship a py.typed marker.
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "sandbox: requires actual kernel sandbox execution",
    "landlock: requires Linux Landlock ABI 6+, seccomp and required namespaces",
]
