name: Python Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        ignore-nothing-to-cache: true
        python-version: "3.12"
    - name: Check
      run: make check
    - name: Build package
      run: make package

  test:
    name: Test Python ${{ matrix.python-version }} (${{ matrix.platform.runner }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        platform:
        - runner: macos-15-intel
          arch: x86_64
        - runner: macos-15
          arch: arm64
        - runner: ubuntu-26.04
          arch: x86_64
        - runner: ubuntu-26.04-arm
          arch: aarch64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: true
        ignore-nothing-to-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Check architecture and kernel
      env:
        EXPECTED_ARCH: ${{ matrix.platform.arch }}
      run: |
        uname -a
        uv run -- python -c 'import os, platform; assert platform.machine() == os.environ["EXPECTED_ARCH"], platform.machine()'
    - name: Test
      run: make test
    - name: Test platform sandbox
      run: make test-sandbox
